# CodeQL static analysis for the Pymatic AskSage plugin.
# Runs on pushes to main, on pull requests targeting main, and weekly.
# Language: java-kotlin. Kotlin is a COMPILED language for CodeQL, so it must
# be built during extraction — build-mode: none does not work for Kotlin.
# We use build-mode: autobuild, which detects Gradle and runs the build.
#
# NOTE: uploading results requires code scanning to be enabled. On a PRIVATE
# repository that needs GitHub Advanced Security; on a PUBLIC repository it is
# free and automatic. The upload step will succeed once this repo is public
# (a required Phase 3 step for the Apache 2.0 Marketplace submission).
name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly scan, Mondays at 07:00 UTC
    - cron: '0 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # CodeQL autobuild for Kotlin compiles via Gradle, which needs a JDK.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
